{% extends "base.html" %}{% block title %}Emergency{% endblock %}
{% block content %}
<h1>🚨 Emergency Contacts</h1><p class="text-muted">Use these numbers for urgent assistance in India.</p>
<div class="row g-3">
{% for service, number in contacts %}
<div class="col-md-6"><div class="card shadow-sm"><div class="card-body d-flex justify-content-between align-items-center">
<div><h5>{{ service }}</h5><span>{{ number }}</span></div><a href="tel:{{ number }}" class="btn btn-danger">Call</a>
</div></div></div>
{% endfor %}
</div>
{% endblock %}
