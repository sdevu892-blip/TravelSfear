{% extends "base.html" %}{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-card mx-auto">
<h2 class="fw-bold mb-4">Create Account</h2>
<form method="post">
<input class="form-control mb-3" name="name" placeholder="Full name" required>
<input class="form-control mb-3" name="email" type="email" placeholder="Email" required>
<input class="form-control mb-3" name="password" type="password" placeholder="Password" required>
<button class="btn btn-primary w-100">Register</button>
</form>
<p class="mt-3">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
</div>
{% endblock %}
