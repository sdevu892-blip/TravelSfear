{% extends "base.html" %}{% block title %}Restaurants{% endblock %}
{% block content %}
<h1>Restaurants</h1>
<form class="row g-2 mb-4">
<div class="col-md-8"><input class="form-control" name="q" value="{{ q }}" placeholder="Search restaurant or location"></div>
<div class="col-md-2"><button class="btn btn-primary w-100">Search</button></div>
</form>
<div class="row g-4">
{% for r in restaurants %}
<div class="col-md-6 col-lg-3"><div class="card h-100 shadow-sm">
<img src="{{ r.image }}" class="card-img-top place-img">
<div class="card-body"><h5>{{ r.name }}</h5><p>{{ r.location }}</p><p>{{ r.cuisine }}</p>
<p>₹{{ r.price|int }} approx.</p><strong>⭐ {{ r.rating }}</strong></div></div></div>
{% else %}<p>No restaurants found.</p>{% endfor %}
</div>
{% endblock %}
