{% extends "base.html" %}{% block title %}Favourites{% endblock %}
{% block content %}<h1>My Favourites</h1><div class="row g-4">
{% for p in places %}
<div class="col-md-6 col-lg-4"><div class="card h-100"><img src="{{ p.image }}" class="card-img-top place-img"><div class="card-body"><h5>{{ p.name }}</h5><p>{{ p.location }}</p><form method="post" action="{{ url_for('favourite', place_id=p.id) }}"><button class="btn btn-outline-danger">Remove</button></form></div></div></div>
{% else %}<p>You have no saved places yet.</p>{% endfor %}
</div>{% endblock %}
